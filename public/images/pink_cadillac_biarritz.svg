<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 144" width="360" height="144" fill="none">
  <!-- Undercarriage Shadow -->
  <ellipse cx="178" cy="74" rx="164" ry="58" fill="black" opacity="0.35" filter="blur(4px)" />

  <!-- Main Body Shell (1959 Cadillac Eldorado Biarritz Mountain Laurel Pink) -->
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7B2C7" />
      <stop offset="12%" stop-color="#EF9DB6" />
      <stop offset="50%" stop-color="#F2A5BD" />
      <stop offset="88%" stop-color="#EF9DB6" />
      <stop offset="100%" stop-color="#E28DA6" />
    </linearGradient>

    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8ECEF" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#C5CCD1" />
      <stop offset="100%" stop-color="#E8ECEF" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#E8F4F8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D1E8F2" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="interiorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262527" />
      <stop offset="50%" stop-color="#3A383D" />
      <stop offset="100%" stop-color="#262527" />
    </linearGradient>
  </defs>

  <!-- Rear Bumper & Lower Body -->
  <path d="M 12 28 C 10 38, 8 52, 8 72 C 8 92, 10 106, 12 116 L 24 118 C 18 102, 16 88, 16 72 C 16 56, 18 42, 24 26 Z" fill="#D3D9DE" stroke="#A6B0B8" stroke-width="1" />

  <!-- Main Cadillac Body Contour -->
  <path d="M 22 23 
           C 50 21, 90 20, 145 20 
           C 160 20, 162 25, 170 25 
           L 216 26 
           C 224 26, 226 21, 240 21 
           C 290 21, 325 24, 335 29
           C 342 33, 345 44, 345 54
           C 346 62, 348 68, 348 72
           C 348 76, 346 82, 345 90
           C 345 100, 342 111, 335 115
           C 325 120, 290 123, 240 123
           C 226 123, 224 118, 216 118
           L 170 119
           C 162 119, 160 124, 145 124
           C 90 124, 50 123, 22 121
           C 15 118, 13 112, 13 108
           L 16 102
           C 20 102, 26 100, 30 94
           L 30 50
           C 26 44, 20 42, 16 42
           L 13 36
           C 13 32, 15 26, 22 23 Z" 
        fill="url(#bodyGradient)" 
        stroke="#D988A3" 
        stroke-width="1.5" />

  <!-- Rear Trunk Deck & Fin Lines -->
  <path d="M 24 38 C 45 37, 75 36, 115 36 L 115 108 C 75 108, 45 107, 24 106 C 20 95, 18 84, 18 72 C 18 60, 20 49, 24 38 Z" fill="#EDA0B9" stroke="#E28FA8" stroke-width="1" />
  <!-- Trunk Lid Seam -->
  <rect x="36" y="42" width="70" height="60" rx="3" fill="none" stroke="#D87E98" stroke-width="1" opacity="0.75" />

  <!-- Iconic Huge 1959 Tailfins (Upper & Lower Spears) -->
  <!-- Top Fin (Left Rear Top) -->
  <path d="M 5 25 L 35 24 L 95 23 L 95 27 L 30 29 L 8 31 Z" fill="#E8ECEF" stroke="#C5CCD1" stroke-width="0.75" />
  <circle cx="5" cy="25" r="3.5" fill="#C5CCD1" />
  <circle cx="4" cy="25" r="2.2" fill="#E51937" />
  <circle cx="11" cy="27" r="3" fill="#C5CCD1" />
  <circle cx="10" cy="27" r="1.8" fill="#E51937" />

  <!-- Bottom Fin (Left Rear Bottom) -->
  <path d="M 5 119 L 35 120 L 95 121 L 95 117 L 30 115 L 8 113 Z" fill="#E8ECEF" stroke="#C5CCD1" stroke-width="0.75" />
  <circle cx="5" cy="119" r="3.5" fill="#C5CCD1" />
  <circle cx="4" cy="119" r="2.2" fill="#E51937" />
  <circle cx="11" cy="117" r="3" fill="#C5CCD1" />
  <circle cx="10" cy="117" r="1.8" fill="#E51937" />

  <!-- Chrome Side Spears along Rear Quarter -->
  <line x1="28" y1="23" x2="160" y2="21" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="28" y1="121" x2="160" y2="123" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Convertible Cockpit Well (Dark Charcoal Interior) -->
  <path d="M 115 32 C 122 32, 126 30, 134 30 L 210 30 C 218 30, 222 34, 226 38 L 228 106 C 222 110, 218 114, 210 114 L 134 114 C 126 114, 122 112, 115 112 Z" fill="#1E1D20" stroke="#4F4D52" stroke-width="1.5" />

  <!-- Rear Leather Bench Seat -->
  <rect x="119" y="36" width="30" height="72" rx="4" fill="url(#interiorGrad)" stroke="#111" stroke-width="1" />
  <!-- Rear Seat Center Pleats / Cushion Details -->
  <rect x="127" y="44" width="18" height="56" rx="2" fill="#2E2C30" stroke="#4A474E" stroke-width="0.75" />
  <line x1="133" y1="48" x2="133" y2="96" stroke="#1A191B" stroke-width="1" />
  <line x1="139" y1="48" x2="139" y2="96" stroke="#1A191B" stroke-width="1" />
  <!-- Center Speaker Grille -->
  <rect x="121" y="69" width="4" height="6" rx="1" fill="#C5CCD1" />

  <!-- Center Console Armrest Divider -->
  <rect x="156" y="66" width="48" height="12" rx="3" fill="#F09EB7" stroke="#D37E97" stroke-width="0.75" />

  <!-- Front Left Bucket Seat -->
  <rect x="166" y="35" width="42" height="30" rx="6" fill="url(#interiorGrad)" stroke="#181719" stroke-width="1.2" />
  <rect x="172" y="39" width="30" height="22" rx="3" fill="#302E33" stroke="#4D4A52" stroke-width="0.75" />
  <line x1="178" y1="41" x2="178" y2="59" stroke="#1A191B" stroke-width="1" />
  <line x1="184" y1="41" x2="184" y2="59" stroke="#1A191B" stroke-width="1" />
  <line x1="190" y1="41" x2="190" y2="59" stroke="#1A191B" stroke-width="1" />
  <line x1="196" y1="41" x2="196" y2="59" stroke="#1A191B" stroke-width="1" />

  <!-- Front Right Bucket Seat -->
  <rect x="166" y="79" width="42" height="30" rx="6" fill="url(#interiorGrad)" stroke="#181719" stroke-width="1.2" />
  <rect x="172" y="83" width="30" height="22" rx="3" fill="#302E33" stroke="#4D4A52" stroke-width="0.75" />
  <line x1="178" y1="85" x2="178" y2="103" stroke="#1A191B" stroke-width="1" />
  <line x1="184" y1="85" x2="184" y2="103" stroke="#1A191B" stroke-width="1" />
  <line x1="190" y1="85" x2="190" y2="103" stroke="#1A191B" stroke-width="1" />
  <line x1="196" y1="85" x2="196" y2="103" stroke="#1A191B" stroke-width="1" />

  <!-- Dashboard & Steering Wheel -->
  <path d="M 210 32 C 218 32, 224 38, 226 44 L 226 100 C 224 106, 218 112, 210 112 L 208 32 Z" fill="#1C1B1E" stroke="#333" stroke-width="1" />
  <!-- Driver Steering Wheel (Left side in cockpit) -->
  <ellipse cx="206" cy="50" rx="7" ry="12" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
  <ellipse cx="206" cy="50" rx="4" ry="7" fill="none" stroke="#D3D9DE" stroke-width="1" />
  <circle cx="206" cy="50" r="2.5" fill="#D4AF37" />

  <!-- Wraparound Curved Windshield -->
  <path d="M 218 30 C 228 32, 236 46, 240 72 C 236 98, 228 112, 218 114 L 214 114 C 224 111, 230 96, 233 72 C 230 48, 224 33, 214 30 Z" fill="url(#glassGrad)" stroke="url(#chromeGrad)" stroke-width="1.8" />
  <!-- Chrome A-Pillar Posts & Sun Visor Mounts -->
  <rect x="214" y="27" width="5" height="4" rx="1" fill="#FFFFFF" stroke="#999" stroke-width="0.5" />
  <rect x="214" y="113" width="5" height="4" rx="1" fill="#FFFFFF" stroke="#999" stroke-width="0.5" />
  <!-- Chrome Rearview Mirror on Windshield -->
  <rect x="232" y="69" width="3" height="6" rx="1" fill="#FFFFFF" stroke="#666" stroke-width="0.5" />

  <!-- Long Sculptured Front Hood -->
  <path d="M 239 30 C 275 30, 312 34, 336 40 C 342 42, 345 52, 345 72 C 345 92, 342 102, 336 104 C 312 110, 275 114, 239 114 Z" fill="url(#bodyGradient)" />
  <!-- Center Hood Peak Line -->
  <line x1="240" y1="72" x2="344" y2="72" stroke="#FFFFFF" stroke-width="1" opacity="0.65" />
  <!-- Left/Right Hood Feature Creases -->
  <path d="M 242 44 C 272 44, 310 46, 336 50" fill="none" stroke="#D87E98" stroke-width="1" opacity="0.5" />
  <path d="M 242 100 C 272 100, 310 98, 336 94" fill="none" stroke="#D87E98" stroke-width="1" opacity="0.5" />

  <!-- Front Cadillac Crest & Gold "V" Emblem -->
  <path d="M 336 67 L 344 72 L 336 77" fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="338,70 341,72 338,74 336,72" fill="#C9182B" stroke="#D4AF37" stroke-width="0.5" />

  <!-- Front Chrome Bumper End Guards & Dual Bullets -->
  <path d="M 338 32 C 344 38, 348 52, 348 72 C 348 92, 344 106, 338 112 L 343 110 C 348 102, 352 88, 352 72 C 352 56, 348 42, 343 34 Z" fill="url(#chromeGrad)" stroke="#9EABB5" stroke-width="1" />
  <!-- Front Bumper Bullet Pods -->
  <circle cx="347" cy="42" r="3" fill="#FFFFFF" stroke="#9EABB5" stroke-width="0.8" />
  <circle cx="347" cy="102" r="3" fill="#FFFFFF" stroke="#9EABB5" stroke-width="0.8" />

  <!-- Chrome Side Mirrors -->
  <rect x="219" y="23" width="4" height="3" rx="1" fill="#FFFFFF" stroke="#999" stroke-width="0.5" />
  <rect x="219" y="118" width="4" height="3" rx="1" fill="#FFFFFF" stroke="#999" stroke-width="0.5" />

  <!-- High-Gloss Specular Highlight Along Entire Flank -->
  <path d="M 35 22 Q 180 19 335 28" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <path d="M 35 122 Q 180 125 335 116" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45" />
</svg>
